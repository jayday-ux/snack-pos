<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>POS ร้านขนม</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.6/JsBarcode.all.min.js"></script>
<style>
:root{--bg:#fff4f7;--ink:#1f2a1f;--deep:#26331f;--lime:#c8f03c;--pink:#ff7aa8;--line:#ecd9e0;--warn:#d9480f;--ok:#2b8a3e;--stage:#ffc2d6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:'Prompt',system-ui,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:88px}
body.scanning{padding-top:38vh}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;transition:transform .12s}
button:active{transform:scale(.95)}
header{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--bg)}
h1{font-size:20px;margin:0;font-weight:800}
#badge{background:var(--deep);color:var(--lime);border-radius:20px;padding:6px 14px;font-weight:600}
.bump{animation:bump .3s}
section{display:none;padding:0 16px 16px}
section.on{display:block}
.row{display:flex;gap:8px;margin-bottom:10px}
input,textarea{width:100%;padding:12px;border:2px solid var(--line);border-radius:12px;background:#fff}
input:focus,textarea:focus{outline:3px solid var(--pink);border-color:transparent}
.btn{padding:12px 18px;border-radius:12px;background:var(--deep);color:var(--lime);font-weight:600;white-space:nowrap}
.btn.pink{background:var(--pink);color:#fff}.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line)}
.swt{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px;cursor:pointer}
.swt input{width:22px;height:22px;accent-color:var(--deep);flex:none;padding:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.chip{background:#fff;border:2px solid var(--line);border-radius:20px;padding:8px 14px}
.low{background:#fff0e6;border:2px solid #ffc9a8;border-radius:12px;padding:10px 12px;margin-bottom:10px;color:var(--warn);font-size:14px}
.item{display:grid;grid-template-columns:1fr auto;gap:4px 10px;background:#fff;border-radius:14px;padding:12px;margin-bottom:8px;animation:pop .2s}
.item b{font-weight:600}.muted{color:#7b6b72;font-size:14px}
.qty{display:flex;align-items:center;gap:10px;justify-content:flex-end}
.qty button{width:34px;height:34px;border-radius:50%;background:var(--bg);font-size:18px}
.total{position:fixed;left:0;right:0;bottom:64px;background:#fff;border-top:2px solid var(--line);padding:10px 16px;display:flex;justify-content:space-between;align-items:center;z-index:6}
.total .btn{padding:14px 28px;font-size:18px}
.total span{font-size:22px;font-weight:800}
nav{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);background:var(--deep);z-index:7;padding-bottom:env(safe-area-inset-bottom)}
nav button{background:none;color:#cfd8c4;padding:12px 4px;font-size:14px}
nav button.on{color:var(--lime);font-weight:600}
#scan{position:fixed;top:0;left:0;right:0;height:38vh;background:#000;z-index:20;display:none}
body.scanning #scan{display:block}
#scan{overflow:hidden}
#reader{width:100%;height:100%;border:0!important}
#reader video{width:100%!important;height:100%!important;object-fit:cover}
#reader img{display:none}
.aim{position:absolute;left:8%;right:8%;top:50%;height:2px;background:rgba(255,60,60,.85);z-index:1;pointer-events:none;box-shadow:0 0 8px rgba(255,60,60,.8)}
.ctl{position:absolute;left:10px;top:10px;z-index:2;display:flex;gap:8px}
.ctl button{background:#fff;border-radius:20px;padding:6px 14px}
#scan::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;z-index:1}
#scan.okf::after{background:rgba(43,138,62,.6);animation:fl .5s}
#scan.badf::after{background:rgba(217,72,15,.6);animation:fl .5s}
#scanMsg{position:absolute;left:10px;right:10px;bottom:10px;z-index:2;padding:10px 12px;border-radius:12px;font-weight:800;font-size:18px;text-align:center;color:#fff;display:none}
#scanMsg.ok{background:var(--ok)}#scanMsg.bad{background:var(--warn)}
@keyframes fl{0%{opacity:1}100%{opacity:0}}
#scan .x{position:absolute;right:10px;top:10px;z-index:2;background:#fff;border-radius:20px;padding:6px 14px}
#toast{position:fixed;left:50%;bottom:150px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:20px;opacity:0;pointer-events:none;transition:.25s;z-index:30;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#ok{position:fixed;inset:0;display:none;place-items:center;z-index:25;pointer-events:none}
#ok.show{display:grid}
#ok i{font-style:normal;width:120px;height:120px;border-radius:50%;background:var(--ok);color:#fff;font-size:70px;display:grid;place-items:center;animation:okp .8s forwards}
/* แคตตาล็อก */
#v-cat{background:var(--stage);margin:0;padding:12px 16px 24px;min-height:calc(100vh - 140px);transition:background .4s}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px}
.tab{background:rgba(255,255,255,.55);border-radius:20px;padding:8px 16px;white-space:nowrap}
.tab.on{background:var(--deep);color:var(--lime);font-weight:600}
.stage{display:grid;gap:16px;align-items:center}
@media(min-width:760px){.stage{grid-template-columns:1fr 1fr}}
.pic{display:grid;place-items:center;font-size:120px;animation:slide .35s}
.pic img{width:100%;max-height:360px;object-fit:contain;filter:drop-shadow(0 18px 18px rgba(0,0,0,.25));animation:float 4s ease-in-out .4s infinite}
.card{background:var(--deep);color:#f3f7ec;border-radius:22px;padding:22px;animation:slide .35s .05s backwards}
.card h2{font-size:30px;line-height:1.1;margin:0 0 8px;font-weight:800}
.card p{margin:0 0 14px;color:#cfd8c4;line-height:1.5}
.price{font-size:34px;font-weight:800;margin:6px 0}
.bc{background:#fff;border-radius:12px;padding:8px;margin:12px 0;text-align:center}
.bc svg{max-width:100%}
.add{width:100%;padding:16px;border-radius:14px;background:var(--pink);color:#fff;font-weight:800;font-size:18px}
.add:disabled{background:#6b7a60}
/* จัดการ */
.list .item{cursor:pointer;grid-template-columns:1fr auto}
.qstat{display:none;margin:0 16px 10px;padding:8px 12px;border-radius:12px;background:#fff0e6;border:2px solid #ffc9a8;color:var(--warn);font-size:14px;text-align:center}
#sumBox .tab{background:#fff;border:2px solid var(--line)}
#sumBox .tab.on{background:var(--deep);border-color:var(--deep)}
.bars{display:flex;align-items:flex-end;gap:3px;height:130px;background:#fff;border-radius:14px;padding:10px 8px 4px;margin-bottom:10px;overflow-x:auto}
.bar{flex:1;min-width:10px;height:100%;display:flex;flex-direction:column;align-items:center;font-size:10px;color:#7b6b72}
.bf{flex:1;width:100%;display:flex;align-items:flex-end}
.bf i{display:block;width:100%;background:var(--pink);border-radius:4px 4px 0 0}
.bar span{height:14px;line-height:14px}
.qstat.bad{background:var(--warn);color:#fff;border-color:var(--warn)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.sum{background:var(--deep);color:var(--lime);border-radius:20px;padding:20px;margin-bottom:14px}
.sum b{font-size:40px;display:block}
#print{display:none}
@media print{body>*:not(#print){display:none!important}#print{display:grid!important;grid-template-columns:repeat(3,1fr);gap:6mm;padding:6mm}
#print div{border:1px dashed #999;padding:4px;text-align:center;font-size:11px;break-inside:avoid}}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}
@keyframes slide{from{transform:translateX(36px);opacity:0}to{transform:none;opacity:1}}
@keyframes float{50%{transform:translateY(-8px)}}
@keyframes bump{40%{transform:scale(1.3)}}
@keyframes okp{0%{transform:scale(.4);opacity:0}30%{transform:scale(1);opacity:1}80%{opacity:1}100%{opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="scan"><button class="x" onclick="closeScanner()">ปิดกล้อง</button><div class="ctl"><button id="zoomBtn" style="display:none"></button><button id="torchBtn" style="display:none"></button></div><div id="reader"></div><div class="aim"></div><div id="scanMsg"></div></div>
<header><h1>POS ร้านขนม</h1><button id="badge" onclick="show('sell')">ตะกร้า 0</button></header>
<div id="qstat" class="qstat" onclick="showFailed()"></div>

<section id="v-sell" class="on">
  <div class="row"><button class="btn" onclick="openScanner(handleCode)">สแกน</button>
  <input id="q" placeholder="พิมพ์ชื่อ/รหัส หรือยิงเครื่องสแกน" autocomplete="off"></div>
  <label class="swt"><input type="checkbox" id="instant"><span>ขายทันทีเมื่อสแกน (ไม่ต้องกดขาย)</span></label>
  <label class="swt"><input type="checkbox" id="autoclose"><span>ปิดกล้องและไปที่ตะกร้าหลังสแกนติด</span></label>
  <div id="found" class="chips"></div>
  <div id="lows"></div>
  <div id="cart"></div>
  <div class="total"><span id="sum">฿0</span><button class="btn" id="sellBtn" onclick="checkout()">ขาย</button></div>
</section>

<section id="v-cat"><div class="tabs" id="tabs"></div><div id="stage"></div></section>

<section id="v-manage">
  <div class="grid2">
    <div style="display:flex;gap:6px"><input id="f-code" placeholder="รหัส/บาร์โค้ด"><button class="btn" onclick="openScanner(c=>{feedback(true,'✓ '+c);$('#f-code').value=c;setTimeout(closeScanner,700)})">สแกน</button></div>
    <input id="f-name" placeholder="ชื่อขนม">
    <input id="f-price" type="number" inputmode="decimal" placeholder="ราคา (บาท)">
    <input id="f-stock" type="number" inputmode="numeric" placeholder="สต็อก">
    <input id="f-reorder" type="number" inputmode="numeric" placeholder="จุดสั่งซื้อ (เตือนเมื่อเหลือ)">
    <input id="f-img" placeholder="ลิงก์รูป (Google Drive)">
  </div>
  <textarea id="f-desc" rows="2" placeholder="รายละเอียดสินค้า" style="margin-bottom:8px"></textarea>
  <div class="row"><button class="btn pink" onclick="saveProduct()">บันทึกสินค้า</button>
  <button class="btn ghost" onclick="clearForm()">ล้างฟอร์ม</button>
  <button class="btn ghost" onclick="printLabels()">พิมพ์สติกเกอร์</button></div>
  <div class="row"><input id="f-add" type="number" inputmode="numeric" placeholder="จำนวนรับเข้า (ใช้รหัสด้านบน)">
  <button class="btn" onclick="restock()">เติมสต็อก</button><button class="btn ghost" onclick="openScanner(restockScan)">สแกนเติม</button></div>
  <div id="plist" class="list"></div>
</section>

<section id="v-sum"><div id="sumBox"></div></section>

<nav>
  <button data-v="sell" class="on" onclick="show('sell')">ขาย</button>
  <button data-v="cat" onclick="show('cat')">แคตตาล็อก</button>
  <button data-v="manage" onclick="show('manage')">สินค้า</button>
  <button data-v="sum" onclick="show('sum')">สรุปยอด</button>
</nav>
<div id="toast"></div><div id="ok"><i>✓</i></div><div id="print"></div>

<script>
// ===== วางลิงก์ Web app จาก Apps Script ตรงนี้ =====
const API = 'https://script.google.com/macros/s/AKfycbyZCNNar3BUJY23xfJbR1Y2eulrwB2LixdgX1i6zg56SZ2-GjQaOFG7ZyGWaPwhQJGC/exec';
const PAL = ['#ffc2d6','#d3ec9a','#ffd6a5','#bfe6f6','#e6cdf7'];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let PIN = localStorage.getItem('pin') || '', products = [], cart = {}, ci = 0;

// ===== ออฟไลน์: คิวบิลที่รอส่ง =====
let queue = [], failed = [], flushing = false;
try { queue = JSON.parse(localStorage.getItem('queue') || '[]'); } catch (e) {}
try { failed = JSON.parse(localStorage.getItem('failed') || '[]'); } catch (e) {}
const saveQueue = () => { localStorage.setItem('queue', JSON.stringify(queue)); renderNet(); };
const cacheProducts = () => { try { localStorage.setItem('products', JSON.stringify(products)); } catch (e) {} };
function renderNet() {
  const el = $('#qstat'); if (!el) return;
  const off = !navigator.onLine, parts = [];
  if (off) parts.push('ออฟไลน์ — ขายต่อได้ตามปกติ');
  if (queue.length) parts.push((off ? '' : 'กำลังส่ง · ') + 'รอส่ง ' + queue.length + ' บิล');
  if (failed.length) parts.push('ส่งไม่สำเร็จ ' + failed.length + ' บิล (แตะดู)');
  el.style.display = parts.length ? 'block' : 'none';
  el.className = 'qstat' + (failed.length ? ' bad' : '');
  el.textContent = parts.join(' · ');
}
function showFailed() {
  if (!failed.length) return;
  alert('บิลที่ส่งไม่สำเร็จ (ต้องแก้สต็อกหรือบันทึกเอง):\n' + failed.map(b => new Date(b.ts).toLocaleString('th-TH') + ' — ' +
    b.items.map(i => ((find(i.code) || {}).name || i.code) + ' ×' + i.qty).join(', ') + ' [' + b.err + ']').join('\n'));
  failed = []; localStorage.setItem('failed', '[]'); renderNet();
}
function applyPending() {   // หักสต็อกของบิลที่ยังไม่ได้ส่งออกจากตัวเลขที่ได้จากเซิร์ฟเวอร์
  queue.forEach(b => b.items.forEach(i => { const p = find(i.code); if (p) p.stock -= i.qty; }));
}
async function flushQueue() {
  if (flushing || !queue.length) { renderNet(); return; }
  flushing = true; let got = false;
  try {
    while (queue.length) {
      const b = queue[0]; let r;
      try { r = await post({ action: 'sell', items: b.items, id: b.id, ts: b.ts }); }
      catch (e) { break; }   // เน็ตหลุด เก็บไว้ส่งรอบหน้า
      if (r.error === 'ยังไม่ได้ใส่ PIN' || r.error === 'PIN ไม่ถูกต้อง') { toast(r.error + ' — บิลยังรอส่งอยู่'); break; }
      queue.shift();
      if (r.error) {
        failed.push({ ...b, err: String(r.error) });
        localStorage.setItem('failed', JSON.stringify(failed));
        toast('มีบิลบันทึกไม่สำเร็จ: ' + r.error);
      } else if (r.products) { products = r.products; got = true; }
      saveQueue();
    }
  } finally { flushing = false; }
  if (got && queue.length) applyPending();
  cacheProducts(); renderNet(); renderCart(); renderLows(); renderManage();
  if ($('#v-cat').classList.contains('on')) renderCat();
}
window.addEventListener('online', () => { renderNet(); flushQueue(); });
window.addEventListener('offline', renderNet);
setInterval(() => { if (queue.length) flushQueue(); }, 30000);

async function get(action, extra = '') {
  const r = await fetch(API + '?action=' + action + extra);
  return r.json();
}
async function post(body, retry = true) {
  body.pin = PIN;
  const r = await (await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) })).json();
  if (r.error === 'pin' && retry) {
    const p = prompt('ใส่รหัส PIN ของร้าน');
    if (!p) return { error: 'ยังไม่ได้ใส่ PIN' };
    PIN = p; localStorage.setItem('pin', p);
    return post(body, false);
  }
  if (r.error === 'pin') { PIN = ''; localStorage.removeItem('pin'); return { error: 'PIN ไม่ถูกต้อง' }; }
  return r;
}
function toast(m) {
  const t = $('#toast'); t.textContent = m; t.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2800);
}
function imgUrl(u) {
  if (!u) return '';
  const m = String(u).match(/\/d\/([\w-]+)/) || String(u).match(/[?&]id=([\w-]+)/);
  return m ? 'https://drive.google.com/thumbnail?id=' + m[1] + '&sz=w800' : u;
}
// จับคู่รหัส: ตัดช่องว่าง และยอมให้ UPC-A (12 หลัก) กับ EAN-13 ที่มี 0 นำหน้าเป็นตัวเดียวกัน
const find = code => {
  const c = String(code).trim();
  const strip = s => /^\d+$/.test(s) ? s.replace(/^0+/, '') : s;
  return products.find(p => p.code === c) || products.find(p => strip(String(p.code).trim()) === strip(c));
};
const baht = n => '฿' + Number(n).toLocaleString('th-TH');

// ===== สลับหน้า =====
function show(v) {
  document.querySelectorAll('section').forEach(s => s.classList.toggle('on', s.id === 'v-' + v));
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  if (v !== 'sell' && v !== 'manage') closeScanner();
  if (v === 'cat') renderCat();
  if (v === 'manage') renderManage();
  if (v === 'sum') loadSummary();
  window.scrollTo(0, 0);
}

// ===== สแกน =====
let qr = null, scanCb = null, lastCode = '', lastAt = 0;
async function openScanner(cb) {
  scanCb = cb; closing = false; lastCode = '';
  document.body.classList.add('scanning');
  try {
    if (!qr) {
      const F = Html5QrcodeSupportedFormats;
      qr = new Html5Qrcode('reader', { formatsToSupport: [F.EAN_13, F.EAN_8, F.UPC_A, F.UPC_E, F.CODE_128, F.CODE_39, F.QR_CODE], experimentalFeatures: { useBarCodeDetectorIfSupported: true } });
    }
    try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); actx.resume(); } catch (e) {}
    if (!qr.isScanning) {
      // ไม่กำหนด qrbox = สแกนทั้งเฟรม (บาร์โค้ดเส้นอยู่ตรงไหนก็อ่านได้) / 1280x720 เร็วกว่า 1080p มาก
      const cfg = { fps: 10, disableFlip: true };
      try {   // โฟกัสต่อเนื่อง
        await qr.start({ facingMode: 'environment' }, { ...cfg, videoConstraints: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 }, advanced: [{ focusMode: 'continuous' }] } }, onScan);
      } catch (e1) {
        await qr.start({ facingMode: 'environment' }, cfg, onScan);
      }
    }
    setupCamTools();
  } catch (e) {
    toast('เปิดกล้องไม่ได้ ให้กด "อนุญาต" การใช้กล้องในเบราว์เซอร์');
    closeScanner();
  }
}
// ซูม + ไฟฉาย (ถ้ากล้องรองรับ) — ซูมช่วยให้ยืนห่างแล้วโฟกัสชัด บาร์โค้ดเล็กก็อ่านติด
let zoomLv = 0;
function setupCamTools() {
  const zb = $('#zoomBtn'), tb = $('#torchBtn');
  zb.style.display = tb.style.display = 'none';
  try {
    const cap = qr.getRunningTrackCameraCapabilities();
    const z = cap.zoomFeature();
    if (z.isSupported()) {
      const lv = [z.min(), Math.min(z.max(), Math.max(z.min() * 2, 2)), Math.min(z.max(), Math.max(z.min() * 3, 3))]
        .filter((v, i, a) => a.indexOf(v) === i);
      zoomLv = lv.length > 1 ? 1 : 0;
      const apply = () => { z.apply(lv[zoomLv]); zb.textContent = 'ซูม ×' + (Math.round(lv[zoomLv] / lv[0] * 10) / 10); };
      zb.onclick = () => { zoomLv = (zoomLv + 1) % lv.length; apply(); };
      apply(); zb.style.display = 'block';
    }
    const t = cap.torchFeature();
    if (t.isSupported()) {
      let on = false;
      tb.onclick = () => { on = !on; t.apply(on); tb.textContent = on ? 'ปิดไฟ' : 'ไฟฉาย'; };
      tb.textContent = 'ไฟฉาย'; tb.style.display = 'block';
    }
  } catch (e) {}
}
function onScan(code) {
  if (closing) return;
  const n = Date.now();
  if (code === lastCode && n - lastAt < 1200) { lastAt = n; return; }
  lastCode = code; lastAt = n;
  scanCb && scanCb(code);
}
async function closeScanner() {
  document.body.classList.remove('scanning');
  try { if (qr && qr.isScanning) await qr.stop(); } catch (e) {}
}

// ===== หน้าขาย =====
let actx = null;
function beep(ok) {
  try {
    const o = actx.createOscillator(), g = actx.createGain();
    o.frequency.value = ok ? 1100 : 280; g.gain.value = 0.2;
    o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime + (ok ? 0.12 : 0.35));
  } catch (e) {}
}
function feedback(ok, msg) {     // เสียง + สั่น + แฟลชสี + ข้อความบนกล้อง
  beep(ok);
  navigator.vibrate && navigator.vibrate(ok ? 60 : [80, 60, 80]);
  const s = $('#scan'), m = $('#scanMsg');
  s.classList.remove('okf', 'badf'); void s.offsetWidth; s.classList.add(ok ? 'okf' : 'badf');
  m.className = ok ? 'ok' : 'bad'; m.textContent = msg; m.style.display = 'block';
  clearTimeout(feedback.t); feedback.t = setTimeout(() => m.style.display = 'none', 1600);
}
function handleCode(code) {
  const p = find(code);
  if (!p) { feedback(false, '✗ ไม่พบรหัส ' + code); toast('ไม่พบรหัส ' + code + ' ไปเพิ่มที่แท็บ "สินค้า"'); return; }
  if (!addToCart(p.code)) { feedback(false, '✗ ' + p.name + ' สต็อกไม่พอ'); return; }
  const q = cart[p.code], instant = $('#instant').checked;
  feedback(true, instant ? '✓ ขาย ' + p.name + ' ' + baht(p.price) : '✓ ' + p.name + ' ×' + q);
  if (instant) checkout();   // โหมดขายทันที
  if ($('#autoclose').checked) {   // ปิดกล้องแล้วเด้งไปที่ตะกร้า
    closing = true;
    setTimeout(async () => { await closeScanner(); window.scrollTo({ top: 0, behavior: 'smooth' }); }, 700);
  }
}
let closing = false;
$('#autoclose').checked = localStorage.getItem('autoclose') !== '0';   // เปิดไว้เป็นค่าเริ่มต้น
$('#autoclose').addEventListener('change', e => localStorage.setItem('autoclose', e.target.checked ? '1' : '0'));
$('#instant').checked = localStorage.getItem('instant') === '1';
$('#instant').addEventListener('change', e => localStorage.setItem('instant', e.target.checked ? '1' : '0'));
function addToCart(code) {
  const p = find(code); if (!p) return false;
  const q = (cart[code] || 0) + 1;
  if (q > p.stock) { toast(p.name + ' เหลือ ' + p.stock + ' ชิ้น'); return false; }
  cart[code] = q; renderCart();
  const b = $('#badge'); b.classList.remove('bump'); void b.offsetWidth; b.classList.add('bump');
  return true;
}
function setQty(code, d) {
  const p = find(code), q = (cart[code] || 0) + d;
  if (q > p.stock) { toast(p.name + ' เหลือ ' + p.stock + ' ชิ้น'); return; }
  if (q <= 0) delete cart[code]; else cart[code] = q;
  renderCart();
}
function renderCart() {
  const ents = Object.entries(cart); let sum = 0, n = 0;
  $('#cart').innerHTML = ents.length ? ents.map(([code, q]) => {
    const p = find(code); sum += p.price * q; n += q;
    return `<div class="item"><b>${esc(p.name)}</b><span style="text-align:right;font-weight:600">${baht(p.price * q)}</span>
      <span class="muted">${baht(p.price)} · คงเหลือ ${p.stock}</span>
      <div class="qty"><button onclick="setQty('${esc(code)}',-1)">−</button><b>${q}</b><button onclick="setQty('${esc(code)}',1)">+</button></div></div>`;
  }).join('') : '<p class="muted" style="text-align:center;padding:30px 0">ยังไม่มีสินค้า กด "สแกน" หรือพิมพ์ค้นหาได้เลย</p>';
  $('#sum').textContent = baht(sum);
  $('#badge').textContent = 'ตะกร้า ' + n;
  $('#sellBtn').disabled = !ents.length;
}
function renderLows() {
  const l = products.filter(p => p.stock <= p.reorder);
  $('#lows').innerHTML = l.length ? `<div class="low">⚠ ใกล้หมด: ${l.map(p => esc(p.name) + ' (' + p.stock + ')').join(', ')}</div>` : '';
}
$('#q').addEventListener('input', e => {
  const t = e.target.value.trim().toLowerCase();
  const r = t ? products.filter(p => p.name.toLowerCase().includes(t) || p.code.toLowerCase().includes(t)).slice(0, 8) : [];
  $('#found').innerHTML = r.map(p => `<button class="chip" onclick="addToCart('${esc(p.code)}');$('#q').value='';$('#found').innerHTML=''">${esc(p.name)} ${baht(p.price)}</button>`).join('');
});
$('#q').addEventListener('keydown', e => {      // เครื่องสแกนบลูทูธจะพิมพ์รหัสแล้วกด Enter
  if (e.key !== 'Enter') return;
  const t = e.target.value.trim();
  if (find(t)) { handleCode(t); e.target.value = ''; $('#found').innerHTML = ''; }
});
function checkout() {
  const items = Object.entries(cart).map(([code, qty]) => ({ code, qty }));
  if (!items.length) return;
  const snap = { ...cart };
  items.forEach(i => { find(i.code).stock -= i.qty; });   // ตัดสต็อกในหน้าจอทันที
  cart = {}; renderCart(); renderLows();
  const ok = $('#ok'); ok.classList.remove('show'); void ok.offsetWidth; ok.classList.add('show');
  setTimeout(() => ok.classList.remove('show'), 800);
  items.map(i => find(i.code)).filter(p => p && p.stock <= p.reorder)
    .forEach(p => toast('⚠ ' + p.name + ' เหลือ ' + p.stock + ' ชิ้น'));
  // เก็บบิลลงคิวในเครื่องก่อนเสมอ แล้วค่อยส่ง — เน็ตหลุดก็ไม่หาย
  queue.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7), items, ts: Date.now() });
  saveQueue(); cacheProducts(); flushQueue();
}

// ===== แคตตาล็อก =====
function renderCat() {
  const box = $('#v-cat');
  if (!products.length) { $('#tabs').innerHTML = ''; $('#stage').innerHTML = '<p>ยังไม่มีสินค้า</p>'; return; }
  if (ci >= products.length) ci = 0;
  const p = products[ci];
  box.style.setProperty('--stage', PAL[ci % PAL.length]);
  $('#tabs').innerHTML = products.map((x, i) => `<button class="tab ${i === ci ? 'on' : ''}" onclick="ci=${i};renderCat()">${esc(x.name)}</button>`).join('');
  const u = imgUrl(p.img);
  $('#stage').innerHTML = `<div class="stage"><div class="pic">${u ? `<img src="${esc(u)}" alt="${esc(p.name)}" onerror="this.replaceWith(document.createTextNode('🍪'))">` : '🍪'}</div>
    <div class="card"><div class="muted" style="color:#a9b59c">${ci + 1} / ${products.length}</div><h2>${esc(p.name)}</h2>
    <p>${esc(p.desc) || 'ขนมของร้าน'}</p><div class="price">${baht(p.price)}</div>
    <div class="muted" style="color:#a9b59c">${p.stock > 0 ? 'เหลือ ' + p.stock + ' ชิ้น' : 'หมดแล้ว'}</div>
    <div class="bc"><svg id="bcsvg"></svg></div>
    <button class="add" ${p.stock > 0 ? '' : 'disabled'} onclick="addToCart('${esc(p.code)}')">เพิ่มลงตะกร้า</button></div></div>`;
  try { JsBarcode('#bcsvg', p.code, { format: 'CODE128', width: 2, height: 60, fontSize: 13, margin: 10 }); } catch (e) {}
  const on = document.querySelector('.tab.on'); on && on.scrollIntoView({ inline: 'center', block: 'nearest' });
}

// ===== จัดการสินค้า =====
function renderManage() {
  $('#plist').innerHTML = products.map(p => `<div class="item" onclick="editP('${esc(p.code)}')"><b>${esc(p.name)}</b><span style="text-align:right">${baht(p.price)}</span>
    <span class="muted">${esc(p.code)}</span><span class="muted" style="text-align:right;${p.stock <= p.reorder ? 'color:var(--warn)' : ''}">สต็อก ${p.stock}</span></div>`).join('');
}
function editP(code) {
  const p = find(code);
  $('#f-code').value = p.code; $('#f-name').value = p.name; $('#f-price').value = p.price;
  $('#f-stock').value = p.stock; $('#f-reorder').value = p.reorder; $('#f-img').value = p.img; $('#f-desc').value = p.desc;
  window.scrollTo(0, 0);
}
function clearForm() { ['code', 'name', 'price', 'stock', 'reorder', 'img', 'desc'].forEach(k => $('#f-' + k).value = ''); }
async function saveProduct() {
  const p = { code: $('#f-code').value.trim(), name: $('#f-name').value.trim(), price: +$('#f-price').value || 0,
    stock: +$('#f-stock').value || 0, reorder: +$('#f-reorder').value || 0, img: $('#f-img').value.trim(), desc: $('#f-desc').value.trim() };
  if (!p.code || !p.name) { toast('ใส่รหัสและชื่อก่อน'); return; }
  const r = await post({ action: 'save', product: p });
  if (r.error) { toast(r.error); return; }
  products = r.products; clearForm(); renderManage(); renderLows(); toast('บันทึกแล้ว');
}
// ===== เติมสต็อก =====
async function doRestock(code, n) {
  if (queue.length) { await flushQueue(); if (queue.length) { toast('ยังมีบิลรอส่ง ' + queue.length + ' บิล ส่งให้เสร็จก่อนค่อยเติมสต็อก'); return false; } }
  try { const r = await get('products'); products = r.products || []; }   // อ่านสต็อกล่าสุดก่อนบวก
  catch (e) { toast('ต้องต่อเน็ตก่อนจึงจะเติมสต็อกได้'); return false; }
  const p = find(code);
  if (!p) { toast('ไม่พบรหัส ' + code); return false; }
  let r;
  try { r = await post({ action: 'save', product: { ...p, stock: p.stock + n } }); }
  catch (e) { toast('ส่งข้อมูลไม่สำเร็จ เช็คอินเทอร์เน็ต'); return false; }
  if (r.error) { toast(r.error); return false; }
  products = r.products; cacheProducts(); renderManage(); renderLows();
  toast('เติม ' + p.name + ' +' + n + ' → เหลือ ' + find(p.code).stock + ' ชิ้น');
  return true;
}
async function restock() {
  const code = $('#f-code').value.trim(), n = parseInt($('#f-add').value, 10);
  if (!code) { toast('ใส่รหัสสินค้าหรือกดเลือกสินค้าจากรายการก่อน'); return; }
  if (!(n > 0)) { toast('ใส่จำนวนที่รับเข้า'); return; }
  if (await doRestock(code, n)) { $('#f-add').value = ''; const p = find(code); if (p) $('#f-stock').value = p.stock; }
}
function restockScan(code) {
  const p = find(code);
  if (!p) { feedback(false, '✗ ไม่พบรหัส ' + code); return; }
  closing = true; feedback(true, '✓ ' + p.name);
  setTimeout(async () => {
    await closeScanner();
    const n = parseInt(prompt('เติม "' + p.name + '" กี่ชิ้น? (ตอนนี้มี ' + p.stock + ')'), 10);
    if (n > 0) doRestock(p.code, n);
  }, 600);
}
function printLabels() {
  if (!products.length) return;
  $('#print').innerHTML = products.map((p, i) => `<div>${esc(p.name)}<br><svg id="pb${i}"></svg></div>`).join('');
  products.forEach((p, i) => { try { JsBarcode('#pb' + i, p.code, { format: 'CODE128', width: 2, height: 50, fontSize: 12, margin: 12 }); } catch (e) {} });
  window.print();
}

// ===== สรุปยอด =====
let sumR = 'today', sumFrom = '', sumTo = '';
const RN = { today: 'วันนี้', yest: 'เมื่อวาน', '7d': '7 วัน', '30d': '30 วัน', month: 'เดือนนี้', custom: 'เลือกวัน' };
const bkk = n => new Date(Date.now() + 7 * 3600e3 + n * 864e5).toISOString().slice(0, 10);   // วันที่ตามเวลาไทย
const fd = s => new Date(s + 'T12:00:00+07:00').toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: '2-digit' });
function sumRange() {
  const t = bkk(0);
  return { today: [t, t], yest: [bkk(-1), bkk(-1)], '7d': [bkk(-6), t], '30d': [bkk(-29), t], month: [t.slice(0, 8) + '01', t], custom: [sumFrom || t, sumTo || t] }[sumR];
}
function pickRange(k) { sumR = k; loadSummary(); }
function applyCustom() {
  sumFrom = $('#s-from').value; sumTo = $('#s-to').value;
  if (sumFrom && sumTo && sumFrom > sumTo) [sumFrom, sumTo] = [sumTo, sumFrom];
  loadSummary();
}
function chipsHtml() {
  const [f, t] = sumRange();
  return '<div class="tabs">' + Object.keys(RN).map(k => `<button class="tab ${k === sumR ? 'on' : ''}" onclick="pickRange('${k}')">${RN[k]}</button>`).join('') + '</div>' +
    (sumR === 'custom' ? `<div class="row"><input type="date" id="s-from" value="${f}"><input type="date" id="s-to" value="${t}"><button class="btn" onclick="applyCustom()">ดู</button></div>` : '');
}
async function loadSummary() {
  const [from, to] = sumRange(), head = chipsHtml();
  $('#sumBox').innerHTML = head + '<p class="muted">กำลังโหลด...</p>';
  let r;
  try { r = await get('summary', '&pin=' + encodeURIComponent(PIN) + '&from=' + from + '&to=' + to); }
  catch (e) { $('#sumBox').innerHTML = head + '<p class="muted">ต้องต่อเน็ตจึงจะดูสรุปยอดได้</p>'; return; }
  if (r.error === 'pin') {
    const p = prompt('ใส่รหัส PIN ของร้าน'); if (!p) { $('#sumBox').innerHTML = head; return; }
    PIN = p; localStorage.setItem('pin', p); return loadSummary();
  }
  const f = r.from || from, t = r.to || to, days = r.days || [];
  const title = f === t ? (f === bkk(0) ? 'ยอดขายวันนี้' : 'ยอดขาย ' + fd(f)) : 'ยอดขาย ' + fd(f) + ' – ' + fd(t);
  let extra = '';
  if (days.length > 1) {
    const max = Math.max(...days.map(d => d.total), 1), best = days.reduce((a, b) => b.total > a.total ? b : a);
    const step = days.length > 14 ? 5 : 1;
    extra = `<div class="bars">${days.map((d, i) => `<div class="bar" title="${fd(d.date)}: ${baht(d.total)}"><div class="bf"><i style="height:${d.total ? Math.max(d.total / max * 100, 3) : 0}%"></i></div><span>${i % step === 0 ? +d.date.slice(8) : ''}</span></div>`).join('')}</div>` +
      `<div class="grid2"><div class="item"><span class="muted">เฉลี่ยต่อวัน</span><b style="text-align:right">${baht(Math.round(r.total / days.length))}</b></div>` +
      `<div class="item"><span class="muted">วันขายดีสุด</span><b style="text-align:right">${best.total ? fd(best.date) + ' · ' + baht(best.total) : '-'}</b></div></div>` +
      `<details class="item" style="display:block"><summary>ยอดรายวัน</summary>${days.slice().reverse().map(d => `<div style="display:flex;justify-content:space-between;padding:6px 0"><span>${fd(d.date)}</span><span>${baht(d.total)} <span class="muted">· ${d.count} ชิ้น</span></span></div>`).join('')}</details>`;
  }
  const pend = queue.length ? `<div class="low">มี ${queue.length} บิลรอส่ง ยังไม่รวมในยอดนี้</div>` : '';
  $('#sumBox').innerHTML = head + pend +
    `<div class="sum">${title}<b>${baht(r.total)}</b>ขายได้ ${r.count} ชิ้น${r.bills != null ? ' · ' + r.bills + ' บิล' : ''}</div>` + extra +
    (r.items.length ? '<p class="muted" style="margin:14px 0 8px">แยกตามสินค้า</p>' + r.items.map(i => `<div class="item"><b>${esc(i.name)}</b><span style="text-align:right">${baht(i.sum)}</span><span class="muted">ขาย ${i.qty} ชิ้น</span></div>`).join('') : '<p class="muted">ช่วงนี้ยังไม่มียอดขาย</p>');
}

async function load() {
  try {
    const r = await get('products'); products = r.products || [];
    if (queue.length) applyPending();
    cacheProducts();
  } catch (e) {   // ออฟไลน์: ใช้สินค้าที่แคชไว้ครั้งล่าสุด
    try { products = JSON.parse(localStorage.getItem('products') || '[]'); } catch (e2) {}
    toast(products.length ? 'ออฟไลน์ ใช้ข้อมูลสินค้าที่บันทึกไว้' : 'โหลดสินค้าไม่ได้ เช็คลิงก์ API และอินเทอร์เน็ต');
  }
  renderCart(); renderLows(); renderManage();
  if ($('#v-cat').classList.contains('on')) renderCat();
}
renderCart(); renderNet(); load().then(flushQueue);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
